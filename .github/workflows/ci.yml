name: Student Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Create package folder
        run: |
          mkdir -p package
          cp -r . package/project
          rm -rf package/project/node_modules
          rm -rf package/project/.git

      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: student-management-package
          path: package/