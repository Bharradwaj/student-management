name: Student Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Show project files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Create project package
        run: |
          mkdir -p package
          tar -czf package/student-management.tar.gz \
            --exclude=.git \
            --exclude=package \
            .

      - name: Upload project package
        uses: actions/upload-artifact@v4
        with:
          name: student-management-package
          path: package/student-management.tar.gz
          